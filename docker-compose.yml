services:
  postgres:
    image: postgres:17-alpine
    container_name: codestorykh-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: account_dev_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init-screening-db.sql runs only on a fresh postgres_data volume (first docker compose up)
      - ./docker/postgres/init-screening-db.sql:/docker-entrypoint-initdb.d/init-screening-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d account_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codestorykh-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8086:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codestorykh.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  kafka:
    image: apache/kafka:4.0.0
    container_name: codestorykh-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: codestorykh-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # OpenTelemetry backend: Prometheus (metrics) + Tempo (traces) + Loki (logs) + Grafana
  # Matches Spring Boot 4 spring-boot-starter-opentelemetry → OTLP flow
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: codestorykh-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9090:9090"   # Prometheus UI
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - lgtm_data:/data
      # Include 4xx/CLIENT_ERROR in Error % (invalid requests); stock dashboard only counts 5xx
      - ./observability/grafana-dashboard-jvm-metrics.json:/otel-lgtm/grafana-dashboard-jvm-metrics.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  pgadmin_data:
  kafka_data:
  lgtm_data: