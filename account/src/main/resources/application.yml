server:
  port: 8081
spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  application:
    name: account
  profiles:
    active: dev

  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: account-aml-link-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.codestorykh.account.dto.event

aml:
  kafka:
    enabled: false
    account-link-topic: aml-account-link-topic
    group-id: account-aml-link-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      hikaricp: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
        step: 10s
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    # Prometheus OTLP ingest maps service.name→job and service.instance.id→instance.
    # Grafana "JVM Overview (OpenTelemetry)" filters instance=~".+" — without instance.id panels stay empty.
    resource-attributes:
      "[service.name]": ${spring.application.name}
      "[service.namespace]": codestorykh
      "[service.instance.id]": ${spring.application.name}:${server.port:8080}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs