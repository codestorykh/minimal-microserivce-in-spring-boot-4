# Shared by all services with spring.profiles.active=dev
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      hikaricp: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
        step: 10s
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    # Prometheus OTLP ingest maps service.name→job and service.instance.id→instance.
    # Grafana "JVM Overview (OpenTelemetry)" filters instance=~".+" — without instance.id panels stay empty.
    resource-attributes:
      "[service.name]": ${spring.application.name}
      "[service.namespace]": codestorykh
      "[service.instance.id]": ${spring.application.name}:${server.port:8080}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
